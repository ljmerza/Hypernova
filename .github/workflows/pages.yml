name: pages
# The one-line install's short address: scripts/get.sh served by GitHub Pages at
# https://ljmerza.github.io/Hypernova/get.sh (README, docs/LINUX.md). The page itself only points
# at the repository. Runs when the script changes on main, and by hand.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/get.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site
        run: |
          mkdir -p _site
          cp scripts/get.sh _site/get.sh
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Hypernova</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/ljmerza/Hypernova">
          <a href="https://github.com/ljmerza/Hypernova">github.com/ljmerza/Hypernova</a>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
