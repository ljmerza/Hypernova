# Modified by Leonardo Merza, 2026. See NOTICE.
name: android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # The app compiles against platform 37, which the runner image may not have yet.
      - name: Android SDK platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0" || "$SDKM" "platforms;android-37"
      # Caches Gradle's downloads and the wrapper; it only saves them from the main branch.
      # v6's default cache is a proprietary component; basic keeps it MIT (docs/DECISIONS.md, "The workflows' actions").
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # What Compose for Desktop's native library links against, even with no display (docs/DEV-SETUP.md, "The desktop app").
      - name: Desktop libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libx11-6 libfontconfig1
      # The app, the shared data layer on both of its targets (docs/PLATFORMS.md, "The shared module") and the desktop app.
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :shared:compileKotlinDesktop :shared:desktopTest :shared:testAndroidHostTest :desktop:compileKotlin :desktop:test --stacktrace
