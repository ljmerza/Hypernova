name: android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The app compiles against platform 37, which the runner image may not have yet.
      - name: Android SDK platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0" || "$SDKM" "platforms;android-37"
      # The built-in Tailscale node (android/tsnet, Go) is bound into the app with gomobile, which
      # android/app/build.gradle.kts runs when libs/tsnet.aar is missing: it needs Go, gomobile (the
      # version go.mod pins) and an NDK.
      - uses: actions/setup-go@v5
        with:
          go-version-file: android/tsnet/go.mod
          cache-dependency-path: android/tsnet/go.sum
      - name: gomobile and the NDK
        run: |
          (cd tsnet && go install golang.org/x/mobile/cmd/gomobile && "$(go env GOPATH)/bin/gomobile" init)
          if ! ls -d "$ANDROID_HOME"/ndk/* > /dev/null 2>&1; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          fi
      # Caches Gradle's downloads and the wrapper; it only saves them from the main branch.
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
