name: android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The app compiles against platform 37, which the runner image may not have yet.
      - name: Android SDK platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0" || "$SDKM" "platforms;android-37"
      # Caches Gradle's downloads and the wrapper; it only saves them from the main branch.
      - uses: gradle/actions/setup-gradle@v4
      # The app, and the shared data layer on both of its targets (docs/PLATFORMS.md, "The shared module").
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :shared:compileKotlinDesktop :shared:desktopTest :shared:testAndroidHostTest --stacktrace
