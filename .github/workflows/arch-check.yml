name: arch-check
# The architecture's rules (docs/PLATFORMS.md, "The rules' checks"), on every push and pull request. A workflow of its own with
# no paths filter: android.yml takes up to 40 minutes and only runs for main and pull requests, and this is for every branch.
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: arch-check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test-arch-check.py
      - run: scripts/arch-check.py
  # Apart, as it's the one that needs Gradle. Resolving the graph needs neither the Android SDK's platform nor a compile.
  classpath:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # v6's default cache is a proprietary component; basic keeps it MIT (docs/DECISIONS.md, "The workflows' actions").
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew :app:checkRuntimeClasspath --stacktrace
      - run: ../scripts/test-arch-check.py --gradle
