name: android-release
# The signed APK for the phone, built with the fork's own release key (repo secrets). Every push to
# main that touches the app (and a manual run) builds it and publishes the next v<version>-ljm.<n>
# release with the APK attached as hypernova-<tag>.apk, so a download says which build it is. A
# release published by hand gets its APK attached too. The key must never change: Android only
# installs an update signed with the key the installed app has.
#
# Secrets: HYPERNOVA_KEYSTORE_B64 (base64 of the .jks), HYPERNOVA_KEYSTORE_PASSWORD,
# HYPERNOVA_KEY_ALIAS, HYPERNOVA_KEY_PASSWORD.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-release.yml']
  release:
    types: [published]
  workflow_dispatch:
# One at a time, never cancelled: each run publishes a numbered release.
concurrency:
  group: android-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Same toolchain as android.yml: platform 37, Go + gomobile + an NDK for the tsnet AAR.
      - name: Android SDK platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0" || "$SDKM" "platforms;android-37"
      - uses: actions/setup-go@v5
        with:
          go-version-file: android/tsnet/go.mod
          cache-dependency-path: android/tsnet/go.sum
      - name: gomobile and the NDK
        run: |
          (cd tsnet && go install golang.org/x/mobile/cmd/gomobile && "$(go env GOPATH)/bin/gomobile" init)
          if ! ls -d "$ANDROID_HOME"/ndk/* > /dev/null 2>&1; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.HYPERNOVA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.HYPERNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HYPERNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HYPERNOVA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::HYPERNOVA_KEYSTORE_B64 secret is not set"; exit 1; fi
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$dir/release.jks"
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$dir/keystore.properties"
          echo "HYPERNOVA_KEYSTORE_PROPS=$dir/keystore.properties" >> "$GITHUB_ENV"
      # distRelease refuses without the release key and verifies the signed APK; output in ../dist.
      - run: ./gradlew :app:distRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hypernova-apk
          path: |
            dist/hypernova.apk
            dist/hypernova.json
            dist/hypernova-mapping.txt
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          cp ../dist/hypernova.apk "../dist/hypernova-$tag.apk"
          gh release upload "$tag" "../dist/hypernova-$tag.apk" --clobber
      # A push or a manual run: the next v<appVersion>-ljm.<n> after the newest fork release, with
      # the APK on it once, as hypernova-<tag>.apk (a download says which build it is). A release
      # made with the workflow token starts no other workflows.
      - name: Publish the next release
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          last=$(gh release list -L 100 --json tagName -q '.[].tagName' | sed -n "s/^v$base-ljm\.\([0-9]*\)$/\1/p" | sort -n | tail -1)
          tag="v$base-ljm.$(( ${last:-0} + 1 ))"
          cp ../dist/hypernova.apk "../dist/hypernova-$tag.apk"
          gh release create "$tag" "../dist/hypernova-$tag.apk" --target "$GITHUB_SHA" --title "$tag" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s "$GITHUB_SHA")"
