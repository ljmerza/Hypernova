name: android-release
# The fork's releases: the signed APK for the phone, built with the fork's own release key (repo
# secrets), and the Linux server package (scripts/pack-linux.sh). Every push to main that touches the
# app, the daemon or the server's install scripts (and a manual run) builds both and publishes the
# next semantic version, vX.Y.Z from the conventional commits since the last one
# (scripts/next-version.sh; docs/RELEASING.md, "Versions"), with hypernova-vX.Y.Z.apk and
# hypernova-server-vX.Y.Z-linux.tar.gz attached, so a download says which build it is. The APK's
# versionName is that version; its versionCode the build minute. One job, so one push makes one release, and every
# release has both files (a daemon-only fix rebuilds the same app). A release published by hand gets
# both attached too. The key must never change: Android only installs an update signed with the key
# the installed app has.
#
# Secrets: HYPERNOVA_KEYSTORE_B64 (base64 of the .jks), HYPERNOVA_KEYSTORE_PASSWORD,
# HYPERNOVA_KEY_ALIAS, HYPERNOVA_KEY_PASSWORD.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'daemon/**'
      - 'scripts/pack-linux.sh'
      - 'scripts/install-linux.sh'
      - '.github/workflows/android-release.yml'
  release:
    types: [published]
  workflow_dispatch:
# One at a time, never cancelled: each run publishes the next version, counted from the tags.
concurrency:
  group: android-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      # The whole history and the tags: the notes list the commits since the release before.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Same toolchain as android.yml: platform 37.
      - name: Android SDK platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0" || "$SDKM" "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.HYPERNOVA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.HYPERNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HYPERNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HYPERNOVA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::HYPERNOVA_KEYSTORE_B64 secret is not set"; exit 1; fi
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$dir/release.jks"
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$dir/keystore.properties"
          echo "HYPERNOVA_KEYSTORE_PROPS=$dir/keystore.properties" >> "$GITHUB_ENV"
      # The release's tag and version. A release made by hand keeps its own tag (the version is the
      # tag without its v). A push or a manual run: the next semantic version from the commits since
      # the last vX.Y.Z tag (scripts/next-version.sh; never under 0.3.0), and that tag as PREV for
      # the notes. Never a tag that already exists.
      - name: Version
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          prev=
          if [ "$EVENT_NAME" = release ]; then
            tag=$EVENT_TAG
          else
            tag="v$(../scripts/next-version.sh "$GITHUB_SHA")"
            prev=$(../scripts/next-version.sh --last "$GITHUB_SHA")
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "::error::tag $tag already exists"; exit 1; fi
          fi
          echo "Release $tag (after ${prev:-none})"
          { echo "TAG=$tag"; echo "PREV=$prev"; echo "VERSION=${tag#v}"; } >> "$GITHUB_ENV"
      # distRelease refuses without the release key and verifies the signed APK; output in ../dist.
      # The versionName is the release's version (build.gradle.kts's appVersion is the local default).
      - run: ./gradlew :app:distRelease --stacktrace -PappVersion="$VERSION"
      # The Linux server package: the daemon's sources, its lockfile, the font and the install
      # script (no node_modules, no Node: the install script fetches Node for the server's own
      # architecture and builds node-pty there, so one package serves x86_64 and arm64). Its path,
      # dist/linux/hypernova-<version>.tar.gz, is the script's last line.
      - name: Linux server package
        run: |
          # The daemon reports the release it is (daemon/src/util.ts reads its package.json).
          (cd ../daemon && npm pkg set version="$VERSION")
          tgz=$(../scripts/pack-linux.sh | tail -1)
          test -s "$tgz"
          echo "SERVER_TGZ=$tgz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: hypernova-apk
          path: |
            dist/hypernova.apk
            dist/hypernova.json
            dist/hypernova-mapping.txt
            dist/linux/hypernova-*.tar.gz
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$TAG
          cp ../dist/hypernova.apk "../dist/hypernova-$tag.apk"
          cp "$SERVER_TGZ" "../dist/hypernova-server-$tag-linux.tar.gz"
          gh release upload "$tag" "../dist/hypernova-$tag.apk" "../dist/hypernova-server-$tag-linux.tar.gz" --clobber
      # A push or a manual run: the release vX.Y.Z (the Version step), with the APK on it once, as
      # hypernova-vX.Y.Z.apk, and the server as hypernova-server-vX.Y.Z-linux.tar.gz (a download says
      # which build it is). A release made with the workflow token starts no other workflows.
      - name: Publish the next release
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$TAG
          cp ../dist/hypernova.apk "../dist/hypernova-$tag.apk"
          cp "$SERVER_TGZ" "../dist/hypernova-server-$tag-linux.tar.gz"
          # The notes: what changed since the release before, by type, and how to install
          # (scripts/release-notes.sh).
          ../scripts/release-notes.sh "$tag" "$PREV" "$GITHUB_SHA" > ../dist/notes.md
          gh release create "$tag" "../dist/hypernova-$tag.apk" "../dist/hypernova-server-$tag-linux.tar.gz" \
            --target "$GITHUB_SHA" --title "$tag" --notes-file ../dist/notes.md
