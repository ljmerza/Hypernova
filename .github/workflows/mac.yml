name: mac
# macOS minutes cost ten times a Linux minute, so this runs by hand or once a week, not on pushes.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: mac/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('mac/Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - run: swift --version
      - run: swift build -c release
