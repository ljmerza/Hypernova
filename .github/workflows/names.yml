name: names
on:
  push:
    branches: [main]
    paths: ['names/**', '.github/workflows/names.yml']
  pull_request:
    paths: ['names/**', '.github/workflows/names.yml']
  workflow_dispatch:
concurrency:
  group: names-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: names
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: names/package-lock.json
      - run: npm ci
      # Tests run in a local Workers runtime with a fake Cloudflare API: no account, no token.
      - run: npx tsc -p .
      - run: npx vitest run
