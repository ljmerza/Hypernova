name: server-packages
# The server's installable packages: the .deb for each Linux processor and the Mac's tarball and .pkg
# for each of its processors, each tested on a runner of its own before it's attached. Two ways in:
#
#   - android-release.yml calls this after it has published a release (attach: true), so a package
#     that fails here can't stop that release, and costs only its own file. It's also why the release
#     doesn't wait for the Mac runners. Its checksums job then lists what really came, from here and
#     from client-packages.yml together.
#   - a pull request that touches these files, or a manual run: everything is built and tested and
#     kept as the run's artifacts. Nothing is published. This is how to try a change on GitHub's Macs.
#
# There's no Mac here to run this on: scripts/test-macos-smoke.sh, on these runners, is the only
# Mac test there is, and no person's Mac (docs/RELEASING.md, "The Mac packages"). No secrets: the .pkg is unsigned.
on:
  workflow_call:
    inputs:
      tag:
        description: The release to attach to (vX.Y.Z)
        type: string
        required: true
      attach:
        description: Attach the packages to that release
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/get.sh'
      - 'scripts/install-linux.sh'
      - 'scripts/install-macos.sh'
      - 'scripts/pack-linux.sh'
      - 'scripts/pack-deb.sh'
      - 'scripts/pack-macos.sh'
      - 'scripts/server-setup.sh'
      - 'scripts/test-install-macos.sh'
      - 'scripts/test-macos-smoke.sh'
      - 'scripts/test-server-deb.sh'
      - 'scripts/test-with-limits.mjs'
      - 'daemon/src/cli/**'
      - '.github/workflows/server-packages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # A .deb holds no native code, but each one is built and tested on its own processor: each user's
  # install builds node-pty there, and that is what can differ.
  deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Version
        env:
          TAG_IN: ${{ inputs.tag }}
        run: |
          # Without a release to attach to, the version in the repository.
          tag="${TAG_IN:-v$(node -p "require('./daemon/package.json').version")}"
          (cd daemon && npm pkg set version="${tag#v}")
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Build
        run: |
          deb=$(scripts/pack-deb.sh "${{ matrix.arch }}" | tail -n 1)
          test -s "$deb"
          echo "DEB=$deb" >> "$GITHUB_ENV"
      # Boots systemd in a container for each system: install, a user's setup, upgrade, remove, purge.
      - name: Test on Ubuntu and Debian
        run: scripts/test-server-deb.sh --deb "$DEB" ubuntu:24.04 debian:12
      - uses: actions/upload-artifact@v7
        with:
          name: hypernova-server-linux-${{ matrix.arch }}-deb
          path: dist/deb/hypernova-server_*.deb
      - name: Attach to the release
        if: ${{ inputs.attach }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          named="dist/hypernova-server-$TAG-linux-${{ matrix.arch }}.deb"
          cp "$DEB" "$named"
          gh release upload "$TAG" "$named" --clobber

  # The two processors' tarballs differ in name only; each is named for the runner that tested it.
  # The tarball is attached before the .pkg is built: a .pkg that fails costs only itself.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Version
        env:
          TAG_IN: ${{ inputs.tag }}
        run: |
          tag="${TAG_IN:-v$(node -p "require('./daemon/package.json').version")}"
          (cd daemon && npm pkg set version="${tag#v}")
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: The scripts, under this Mac's own bash, with stand-ins
        run: /bin/bash scripts/test-install-macos.sh
      - name: Build the tarball
        run: |
          tgz=$(scripts/pack-macos.sh "${{ matrix.arch }}" | tail -n 1)
          test -s "$tgz"
          echo "TGZ=$tgz" >> "$GITHUB_ENV"
      # The real thing: the LaunchAgent, status, doctor, the API, restarts, uninstall.
      - name: Smoke test, from the tarball
        run: /bin/bash scripts/test-macos-smoke.sh --tarball "$TGZ"
      - name: Attach the tarball to the release
        if: ${{ inputs.attach }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          named="dist/hypernova-server-$TAG-macos-${{ matrix.arch }}.tar.gz"
          cp "$TGZ" "$named"
          gh release upload "$TAG" "$named" --clobber
      - name: Build the .pkg
        run: |
          pkg=$(scripts/pack-macos.sh "${{ matrix.arch }}" --pkg | tail -n 1)
          test -s "$pkg"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - name: Smoke test, from the .pkg
        run: /bin/bash scripts/test-macos-smoke.sh --pkg "$PKG"
      - name: Attach the .pkg to the release
        if: ${{ inputs.attach }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          named="dist/hypernova-server-$TAG-macos-${{ matrix.arch }}.pkg"
          cp "$PKG" "$named"
          gh release upload "$TAG" "$named" --clobber
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: hypernova-server-macos-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            dist/macos/hypernova-server-*

  # The daemon's whole suite on a Mac. Nothing depends on it, so it never holds a package back. Its
  # first run failed 13 tests, all sorted out (docs/DECISIONS.md, "The daemon's tests on a Mac");
  # continue-on-error stays until a run has shown it green, because that hasn't happened yet.
  macos-unit:
    runs-on: macos-latest
    timeout-minutes: 25
    continue-on-error: true
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      # What this machine's `say` can make, to read: its AAC hung on the macOS 26 image while its WAV
      # took a second or two. This says which formats it is, and whether afconvert could stand in.
      - name: What say renders here
        continue-on-error: true
        run: |
          try() {
            out=$1; shift
            start=$SECONDS
            perl -e 'alarm shift; exec @ARGV' 20 "$@" </dev/null
            echo "exit $? in $((SECONDS - start)) s, $(wc -c <"$out" 2>/dev/null || echo no) bytes: $*"
          }
          sw_vers -productVersion
          t=$RUNNER_TEMP
          try "$t/a.wav" say -o "$t/a.wav" --file-format=WAVE --data-format=LEI16@24000 'Hello there.'
          try "$t/b.m4a" say -o "$t/b.m4a" --file-format=m4af --data-format=aac 'Hello there.'
          try "$t/c.m4a" say -o "$t/c.m4a" --file-format=m4af --data-format=aac@22050 'Hello there.'
          try "$t/d.m4a" say -o "$t/d.m4a" --file-format=m4af --data-format=alac 'Hello there.'
          try "$t/e.caf" say -o "$t/e.caf" --file-format=caff --data-format=aac 'Hello there.'
          try "$t/f.m4a" afconvert -f m4af -d aac "$t/a.wav" "$t/f.m4a"
      - run: npm ci
      - run: npx tsc -p .
      # Not plain `npm test`: a run that hung took the job's 25 minutes with it, and every result. Here a
      # hang fails by name after 5 minutes (the slowest test takes about a minute on a busy machine), its
      # file stops at 10, and the run at 19, leaving the rest of the job's time to say so (docs/DECISIONS.md,
      # "A time limit on each of macos-unit's tests"). The step's own limit is only for the script failing to stop.
      - name: The tests, with time limits and a summary
        timeout-minutes: 20
        run: node ../scripts/test-with-limits.mjs 300 600 1140
