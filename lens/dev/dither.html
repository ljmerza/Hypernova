<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>dither</title></head>
<body style="background:#222;color:#ccc;font:13px monospace;margin:10px"><div id="out"></div>
<script type="module">
import { demoScreenshot } from '../src/data/demo.ts';
import { waitForEvenAppBridge } from '@evenrealities/even_hub_sdk';
if (location.search.includes('sdk')) await waitForEvenAppBridge();
import { ditherScope, tile } from '../src/lens/gray.ts';
const { url } = demoScreenshot();
const img = new Image();
img.onload = () => {
  // Telescope's whole picture: 576 x 256 under the label line, in four 288 x 128 tiles.
  const c = ditherScope(img, null, 576, 256);
  const out = document.getElementById('out');
  const show = (el, label) => { const d = document.createElement('div'); d.textContent = label; d.append(el); out.append(d); };
  img.style.width = '576px'; show(img, 'source');
  c.style.width = '576px'; c.style.imageRendering = 'pixelated'; show(c, 'dithered (levels as grey)');
  const t = tile(c, 0, 0, 288, 128);
  const i2 = new Image(); i2.src = URL.createObjectURL(new Blob([t.png], { type: 'image/png' })); i2.style.width = '576px'; show(i2, `tile 0: ${t.png.byteLength} bytes`);
  const d = c.getContext('2d').getImageData(0, 0, 576, 256).data; let max = 0, lit = 0; for (let i = 0; i < d.length; i += 4) { max = Math.max(max, d[i]); if (d[i]) lit++; }
  show(document.createTextNode(` max=${max} lit=${lit}`), 'stats');
  const td = document.createElement('canvas'); td.width = 288; td.height = 128; td.getContext('2d').drawImage(c, 0, 0, 288, 128, 0, 0, 288, 128);
  const dd = td.getContext('2d').getImageData(0, 0, 288, 128).data; let lit2 = 0; for (let i = 0; i < dd.length; i += 4) if (dd[i]) lit2++;
  console.info('[dither] lit', lit, 'max', max, 'tile0 bytes', t.png.byteLength, 'tile0 lit', lit2, 'c', c.width, c.height);
};
img.src = url;
</script></body></html>
