<!doctype html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<title>Hypernova social card</title>
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/tools/og.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<canvas class="nebulae" aria-hidden="true"></canvas>
<canvas class="sky" aria-hidden="true"></canvas>
<div class="card-og">
  <div class="left">
    <div class="brandline"><span class="mk"></span><span class="wordmark">hypernova<i>/</i></span></div>
    <h1>A control room for Claude Code <span>and Codex.</span></h1>
    <p>Watch, approve and steer your coding agents from your Android phone, the Mac's menu bar and Even G2 glasses. Self-hosted on your Mac or Linux server. Open source.</p>
    <div class="chips"><span class="chip">Android</span><span class="chip">macOS</span><span class="chip">Linux</span><span class="chip">Even G2</span></div>
  </div>
  <div class="stage" data-orrery data-centered>
    <canvas aria-hidden="true"></canvas>
    <div class="sky-labels" aria-hidden="true"></div>
  </div>
</div>
<canvas class="grain" aria-hidden="true"></canvas>
<script src="/js/sky.js"></script>
</body>
</html>
